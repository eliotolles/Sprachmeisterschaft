<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Capi — linh vật capybara đeo tai nghe">
  <defs>
    <radialGradient id="capi-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#e2622b" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#e2622b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e2622b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capi-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99a68"/>
      <stop offset="100%" stop-color="#a9764f"/>
    </linearGradient>
    <linearGradient id="capi-fur-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9764f"/>
      <stop offset="100%" stop-color="#8a5a35"/>
    </linearGradient>
  </defs>

  <!-- Hào quang ấm phía sau -->
  <circle cx="240" cy="240" r="215" fill="url(#capi-glow)"/>

  <!-- Thân -->
  <ellipse cx="240" cy="415" rx="155" ry="82" fill="url(#capi-fur-dark)"/>
  <ellipse cx="240" cy="425" rx="105" ry="58" fill="#c99a68" opacity="0.55"/>
  <!-- Chân trước -->
  <ellipse cx="178" cy="448" rx="32" ry="20" fill="#a9764f"/>
  <ellipse cx="302" cy="448" rx="32" ry="20" fill="#a9764f"/>

  <!-- Tai -->
  <ellipse cx="148" cy="138" rx="27" ry="30" fill="#a9764f"/>
  <ellipse cx="148" cy="140" rx="14" ry="17" fill="#8a5a35"/>
  <ellipse cx="332" cy="138" rx="27" ry="30" fill="#a9764f"/>
  <ellipse cx="332" cy="140" rx="14" ry="17" fill="#8a5a35"/>

  <!-- Đầu -->
  <rect x="108" y="128" width="264" height="216" rx="92" fill="url(#capi-fur)"/>
  <!-- Mõm sáng -->
  <ellipse cx="240" cy="290" rx="98" ry="52" fill="#dcb98f" opacity="0.85"/>

  <!-- Mắt -->
  <circle cx="184" cy="228" r="17" fill="#2b1a12"/>
  <circle cx="296" cy="228" r="17" fill="#2b1a12"/>
  <circle cx="190" cy="222" r="6" fill="#ffffff"/>
  <circle cx="302" cy="222" r="6" fill="#ffffff"/>
  <!-- Lông mày -->
  <path d="M 168 200 Q 184 190 200 200" fill="none" stroke="#8a5a35" stroke-width="5" stroke-linecap="round"/>
  <path d="M 280 200 Q 296 190 312 200" fill="none" stroke="#8a5a35" stroke-width="5" stroke-linecap="round"/>

  <!-- Mũi + miệng -->
  <ellipse cx="240" cy="286" rx="27" ry="19" fill="#4a3226"/>
  <path d="M 240 305 L 240 322" stroke="#4a3226" stroke-width="4" stroke-linecap="round"/>
  <path d="M 240 322 Q 240 340 214 336" fill="none" stroke="#4a3226" stroke-width="4" stroke-linecap="round"/>
  <path d="M 240 322 Q 240 340 266 336" fill="none" stroke="#4a3226" stroke-width="4" stroke-linecap="round"/>
  <!-- Râu -->
  <g stroke="#6b4a2f" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <line x1="128" y1="296" x2="168" y2="302"/>
    <line x1="130" y1="314" x2="168" y2="312"/>
    <line x1="352" y1="296" x2="312" y2="302"/>
    <line x1="350" y1="314" x2="312" y2="312"/>
  </g>

  <!-- Tai nghe: vòng qua đầu -->
  <path d="M 112 218 Q 104 82 240 82 Q 376 82 368 218" fill="none" stroke="#14b8a6" stroke-width="24" stroke-linecap="round"/>
  <!-- Củ tai -->
  <rect x="88" y="182" width="48" height="96" rx="22" fill="#0f766e"/>
  <rect x="98" y="196" width="28" height="68" rx="14" fill="#14b8a6"/>
  <rect x="344" y="182" width="48" height="96" rx="22" fill="#0f766e"/>
  <rect x="354" y="196" width="28" height="68" rx="14" fill="#14b8a6"/>

  <!-- Vòng cổ + thẻ tên -->
  <path d="M 148 356 Q 240 384 332 356 L 332 378 Q 240 406 148 378 Z" fill="#0f766e"/>
  <circle cx="240" cy="402" r="26" fill="#eab308" stroke="#b45309" stroke-width="2"/>
  <text x="240" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#422006">CAPI</text>
</svg>
