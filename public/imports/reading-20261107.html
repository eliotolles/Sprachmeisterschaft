<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Nhập bộ Đọc đã chuẩn bị</title>
<style>body{font:16px system-ui;max-width:850px;margin:50px auto;padding:20px;background:#f5f1e8;color:#27221c}button,select{font:inherit;padding:12px;margin:8px}p{line-height:1.6}</style>
<h1>Nhập bộ Đọc từ 3 ZIP đã cung cấp</h1><p>Chỉ thêm bộ và bài mới có ID riêng của Sprachmeisterschaft. Không ghi đè, không xóa, không tự nhập khi mở trang.</p><p id="summary">Đang tải manifest…</p><select id="batch" aria-label="Lô nhập"></select><button id="copy" disabled>Sao chép SQL của lô đã chọn</button><p id="status" role="status"></p>
<script type="module">
const manifest=await(await fetch('./reading-20261107-manifest.json')).json();summary.textContent=`${manifest.folders} bộ · ${manifest.records} phần · ${manifest.questions} câu hỏi`;
const select=document.querySelector('#batch');['0 · Các bộ học',...manifest.files.map((_,i)=>`${i+1} · Lô bài đọc ${i+1}`)].forEach((label,i)=>{const o=document.createElement('option');o.value=i;o.textContent=label;select.append(o)});document.querySelector('#copy').disabled=false;
const quote=value=>"'"+JSON.stringify(value).replaceAll("'","''")+"'";
const owner="(SELECT min(owner) FROM sprach_exam_backup_20261107 HAVING count(DISTINCT owner)=1 AND count(*)=174)";
document.querySelector('#copy').onclick=async()=>{try{const n=Number(select.value),records=await(await fetch(n?manifest.files[n-1]:'reading-20261107-folders.json')).json();let sql;
if(!n)sql=`INSERT INTO ee_config(key,value) SELECT 'sprach:collection:'||json_extract(value,'$.id'),json_set(value,'$.owner',${owner}) FROM json_each(${quote(records)}) WHERE json_extract(value,'$.sourceBundle')='reading-screenshots-20261107' AND ${owner} IS NOT NULL ON CONFLICT(key) DO NOTHING RETURNING key;`;
else sql=`INSERT INTO ee_records(id,owner,kind,title,level,public,data,updated_at) SELECT json_extract(value,'$.id'),${owner},'reading',json_extract(value,'$.title'),'B1',1,json_extract(value,'$.data'),datetime('now') FROM json_each(${quote(records)}) WHERE json_extract(value,'$.id') GLOB 'reading-20261107-*-lesen' AND json_extract(value,'$.data.sourceBundle')='reading-screenshots-20261107' AND ${owner} IS NOT NULL ON CONFLICT(id) DO NOTHING RETURNING id;`;
await navigator.clipboard.writeText(sql);document.querySelector('#status').textContent=`Đã sao chép lô ${n}: ${records.length} mục; ${sql.length} ký tự. Chưa thực thi SQL.`;
}catch(e){document.querySelector('#status').textContent=e.message}};
</script>
