name: Migration safety tests

on:
  push:
    branches:
      - migration/elio-data-preserve-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JavaScript tests without deployment credentials
        run: npm test
      - name: Run Python importer safety tests without secrets
        run: python -m unittest discover -s tests -p 'test_*.py' -v
